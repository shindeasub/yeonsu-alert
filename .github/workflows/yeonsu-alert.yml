name: 연수원 빈방 알림

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 시작 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:         # Actions 화면에서 [Run workflow] 로 직접 실행

concurrency:
  group: yeonsu-alert
  cancel-in-progress: false

permissions:
  contents: write            # 알림기록.json 저장용

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 빈 방 조회
        env:
          TZ: Asia/Seoul
          RUN_MINUTES: "4"   # 한 번 실행에 4분 동안 1분 간격으로 조회
          YEONSU_ID: ${{ secrets.YEONSU_ID }}
          YEONSU_PW: ${{ secrets.YEONSU_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 yeonsu_alert.py

      - name: 알림기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "알림기록 갱신"
            git pull --rebase
            git push
          fi
