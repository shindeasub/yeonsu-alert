; ============================================================
;  연수원 빈 방 알림 설정 파일 (GitHub 서버용)
;  - 줄 맨 앞이 ; 인 줄은 설명입니다.
;  - GitHub 웹사이트에서 이 파일을 열고 연필(✏️) 버튼으로 고친 뒤
;    [Commit changes] 를 누르면 다음 실행부터 바로 적용됩니다.
;  - 아이디/비밀번호/폰알림 이름은 여기 적지 않습니다! (GitHub Secrets 에 등록)
; ============================================================

[조건]
; 연수원: 속초, 서천, 수안보 (여러 곳이면 쉼표로)  예) 수안보, 속초
연수원 = 수안보

; 체크인 날짜: 하루씩 또는 기간(~)으로, 여러 개는 쉼표로
;   예) 2026-11-21
;   예) 2026-11-20~2026-11-30
;   예) 2026-11-21, 2026-12-05~2026-12-06
날짜 = 2026-11-7

; 요일: 비워두면 모든 요일. 기간으로 넣고 금,토만 보고 싶을 때 등  예) 금,토
요일 =

; 박수: 연속으로 몇 박 머물지 (2박이면 이틀 모두 같은 객실형이 비어야 알림)
박수 = 1

; 객실형: 전체 또는 A,B,O 처럼 (수안보 A·B·O형 / 속초 A·B형 / 서천 A·B·C·O형)
객실형 = A

; 최소객실수: 이 개수 이상 비었을 때만 알림 (보통 1)
최소객실수 = 1

[실행]
; 몇 분마다 확인할지 (1이면 1분마다)
조회간격_분 = 1

; 알림을 보내지 않을 시간대 (한국시간, 비워두면 항상 보냄)  예) 23~7
알림쉬는시간 =
